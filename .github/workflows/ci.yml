name: AuditEQ Continuous Integration & Compliance Verification

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master, production ]

jobs:
  verify:
    name: Lint, Build & Regulatory Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static TypeScript Type Checking
        run: npm run lint

      - name: Production Bundle Compilation
        run: npm run build

      - name: Execute Full SEBI Regulatory & Security Test Suites
        run: npm test
        env:
          NODE_ENV: test
