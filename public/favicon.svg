<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Quantum Cyber Gradients -->
    <linearGradient id="quantumRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="obsidianCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="60%" stop-color="#090b10" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <linearGradient id="glossReflection" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <filter id="neonBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Glowing Hexagonal Diamond Prism -->
  <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" 
           fill="url(#obsidianCore)" 
           stroke="url(#quantumRing)" 
           stroke-width="2.5" 
           filter="url(#shadow3D)" />

  <!-- Inner Glossy Cyber Chamfer -->
  <polygon points="32,6 54,19 54,44 32,57 10,44 10,19" 
           stroke="#ffffff" 
           stroke-opacity="0.15" 
           stroke-width="1" />

  <!-- Top Gloss Specular Highlight Flare -->
  <path d="M10 19 L32 6 L54 19 L46 24 L32 14 L18 24 Z" 
        fill="url(#glossReflection)" />

  <!-- Center Holographic Delta A + Waveform Core -->
  <!-- Stylized Quantum 'A' Structure -->
  <path d="M32 15 L45 43 L38 43 L34 34 L30 34 L26 43 L19 43 Z" 
        fill="none" 
        stroke="url(#quantumRing)" 
        stroke-width="2.2" 
        stroke-linejoin="round" 
        filter="url(#neonBloom)" />

  <!-- Dynamic Center Audio Waveform Bar (Diarization Pulse) -->
  <path d="M22 34 L42 34" 
        stroke="url(#waveGlow)" 
        stroke-width="2.5" 
        stroke-linecap="round" />

  <!-- Quantum Core Pulse Bead -->
  <circle cx="32" cy="27" r="2.8" fill="#00f0ff" filter="url(#neonBloom)" />
  <circle cx="32" cy="27" r="1.2" fill="#ffffff" />
</svg>
